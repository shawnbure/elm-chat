<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Irreversible deletion state lifecycle</title>
  <desc id="desc">A state diagram showing Active moving to Sealed, Destroyed, and Reclaimed, with expiry able to move Active or Sealed to Destroyed and no transition out of Destroyed or Reclaimed.</desc>
  <rect width="1200" height="675" rx="36" fill="#f4f7ff"/>
  <text x="70" y="88" fill="#111827" font-family="Arial, sans-serif" font-size="38" font-weight="700">Destruction must move in one direction</text>
  <text x="70" y="132" fill="#566174" font-family="Arial, sans-serif" font-size="22">Delayed work may advance the lifecycle. It must never resurrect an object.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="245" width="220" height="120" rx="24" fill="#ffffff" stroke="#8aa4e8" stroke-width="3"/>
    <text x="180" y="302" fill="#111827" font-size="28" font-weight="700">ACTIVE</text>
    <text x="180" y="335" fill="#566174" font-size="18">reads + writes</text>
    <rect x="350" y="245" width="220" height="120" rx="24" fill="#ffffff" stroke="#8aa4e8" stroke-width="3"/>
    <text x="460" y="302" fill="#111827" font-size="28" font-weight="700">SEALED</text>
    <text x="460" y="335" fill="#566174" font-size="18">no new writes</text>
    <rect x="630" y="245" width="220" height="120" rx="24" fill="#e8efff" stroke="#3b73f1" stroke-width="4"/>
    <text x="740" y="302" fill="#0e3f9e" font-size="28" font-weight="700">DESTROYED</text>
    <text x="740" y="335" fill="#315898" font-size="18">normal access denied</text>
    <rect x="910" y="245" width="220" height="120" rx="24" fill="#111827"/>
    <text x="1020" y="302" fill="#ffffff" font-size="28" font-weight="700">RECLAIMED</text>
    <text x="1020" y="335" fill="#d9e2f2" font-size="18">recovery window ended</text>
  </g>
  <g stroke="#3b73f1" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M290 305 H340"/>
    <path d="M570 305 H620"/>
    <path d="M850 305 H900"/>
    <path d="M180 375 C180 485 740 485 740 375"/>
    <path d="M460 375 C460 430 740 430 740 375"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b73f1"/></marker>
  </defs>
  <text x="410" y="520" fill="#315898" font-family="Arial, sans-serif" font-size="20" font-weight="700">expiry</text>
  <rect x="70" y="560" width="1060" height="58" rx="18" fill="#ffffff" stroke="#cad5ec"/>
  <text x="600" y="597" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Invariant: no request, retry, replay, or restore leaves DESTROYED or RECLAIMED.</text>
</svg>
