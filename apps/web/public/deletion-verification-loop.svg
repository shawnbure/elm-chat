<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Negative-evidence deletion verification loop</title>
  <desc id="desc">A verification loop that creates a harmless marker, destroys the object, attacks every recovery path, inspects controlled state, and records the remaining boundary.</desc>
  <rect width="1200" height="675" rx="36" fill="#f4f7ff"/>
  <text x="70" y="82" fill="#111827" font-family="Arial, sans-serif" font-size="38" font-weight="700">Deletion verification looks for resurrection</text>
  <text x="70" y="126" fill="#566174" font-family="Arial, sans-serif" font-size="22">A 200 response proves request acceptance. Negative evidence tests whether the data can return.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="600" cy="360" r="116" fill="#111827"/>
    <text x="600" y="318" fill="#ffffff" font-size="21" font-weight="700">NO CONTROLLED</text>
    <text x="600" y="348" fill="#ffffff" font-size="21" font-weight="700">PATH CAN SERVE</text>
    <text x="600" y="378" fill="#ffffff" font-size="21" font-weight="700">OR RECREATE</text>
    <text x="600" y="408" fill="#ffffff" font-size="21" font-weight="700">THE DATA</text>
    <g fill="#ffffff" stroke="#3b73f1" stroke-width="3">
      <rect x="445" y="160" width="310" height="92" rx="22"/>
      <rect x="790" y="260" width="310" height="92" rx="22"/>
      <rect x="700" y="500" width="310" height="92" rx="22"/>
      <rect x="190" y="500" width="310" height="92" rx="22"/>
      <rect x="100" y="260" width="310" height="92" rx="22"/>
    </g>
    <g fill="#111827" font-size="19" font-weight="700">
      <text x="600" y="199">1 · CREATE A</text><text x="600" y="227">HARMLESS MARKER</text>
      <text x="945" y="299">2 · DESTROY THROUGH</text><text x="945" y="327">AUTHORIZED PATHS</text>
      <text x="855" y="539">3 · RESTART, RETRY,</text><text x="855" y="567">REPLAY, RESTORE</text>
      <text x="345" y="539">4 · SEARCH EVERY</text><text x="345" y="567">CONTROLLED STATE</text>
      <text x="255" y="299">5 · RECORD THE</text><text x="255" y="327">REMAINING BOUNDARY</text>
    </g>
  </g>
  <g stroke="#3b73f1" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M755 206 C875 210 935 225 945 250"/>
    <path d="M1060 348 C1050 445 975 495 930 505"/>
    <path d="M700 565 C610 620 500 620 440 582"/>
    <path d="M270 505 C165 455 135 390 150 348"/>
    <path d="M255 270 C310 210 380 195 445 202"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b73f1"/></marker>
  </defs>
  <text x="600" y="630" text-anchor="middle" fill="#315898" font-family="Arial, sans-serif" font-size="20">Repeat after cache refresh, replica catchup, delayed delivery, and recovery exercises.</text>
</svg>
