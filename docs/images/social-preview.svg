<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">elm.chat social preview</title>
  <desc id="description">A chat room built to disappear. No account, one-time invites, and open source.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="0.55" stop-color="#f4f0ff" />
      <stop offset="1" stop-color="#fff8f1" />
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1478ff" />
      <stop offset="1" stop-color="#7257ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#1d2b53" flood-opacity="0.14" />
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#cdd5e4" stroke-width="1" opacity="0.45" />
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#background)" />
  <circle cx="1150" cy="56" r="180" fill="#7c5cff" opacity="0.08" />
  <circle cx="92" cy="618" r="220" fill="#1486ff" opacity="0.07" />

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(74 70)">
      <text x="0" y="0" dominant-baseline="hanging" fill="#151923" font-size="27" font-weight="750" letter-spacing="5">ELM.CHAT</text>
      <text x="0" y="92" dominant-baseline="hanging" fill="#11151d" font-size="70" font-weight="780" letter-spacing="-3">Chat built to</text>
      <text x="0" y="172" dominant-baseline="hanging" fill="#11151d" font-size="70" font-weight="780" letter-spacing="-3">disappear.</text>
      <text x="0" y="300" dominant-baseline="hanging" fill="#475064" font-size="29" font-weight="520">No account. One-time invite.</text>
      <text x="0" y="342" dominant-baseline="hanging" fill="#475064" font-size="29" font-weight="520">Open source.</text>

      <g transform="translate(0 428)">
        <rect width="404" height="68" rx="34" fill="url(#button)" />
        <text x="202" y="35" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Invite one person</text>
      </g>

      <text x="0" y="542" dominant-baseline="hanging" fill="#687187" font-size="18" font-weight="560">EARLY-STAGE · NOT INDEPENDENTLY AUDITED</text>
    </g>

    <g transform="translate(706 52)" filter="url(#shadow)">
      <rect width="500" height="536" rx="32" fill="#ffffff" stroke="#dfe5ef" stroke-width="2" />
      <rect x="1" y="1" width="498" height="534" rx="31" fill="url(#grid)" opacity="0.72" />

      <g transform="translate(34 32)">
        <text x="0" y="0" dominant-baseline="hanging" fill="#6a7387" font-size="16" font-weight="700" letter-spacing="2">ELM CHAT</text>
        <text x="0" y="34" dominant-baseline="hanging" fill="#171c26" font-size="35" font-weight="760">k7H3mQp2</text>
        <text x="0" y="82" dominant-baseline="hanging" fill="#6a7387" font-size="17">Messages vanish after 7m.</text>

        <g transform="translate(0 130)">
          <rect width="432" height="58" rx="18" fill="#f8fafc" stroke="#dce3ed" />
          <circle cx="27" cy="29" r="8" fill="#1f8cff" />
          <text x="46" y="30" dominant-baseline="middle" fill="#222a37" font-size="18" font-weight="650">You</text>
          <text x="405" y="30" dominant-baseline="middle" text-anchor="end" fill="#657086" font-size="16">1 present</text>
        </g>

        <g transform="translate(0 220)">
          <rect x="0" y="0" width="306" height="72" rx="24" fill="#edf5ff" stroke="#cce1ff" />
          <text x="22" y="24" dominant-baseline="middle" fill="#526078" font-size="14" font-weight="650">YOU</text>
          <text x="22" y="49" dominant-baseline="middle" fill="#172033" font-size="18">This message disappears.</text>
        </g>

        <g transform="translate(78 314)">
          <rect x="0" y="0" width="354" height="72" rx="24" fill="#f3efff" stroke="#ddd1ff" />
          <text x="22" y="24" dominant-baseline="middle" fill="#65568d" font-size="14" font-weight="650">GUEST</text>
          <text x="22" y="49" dominant-baseline="middle" fill="#201834" font-size="18">That is exactly the point.</text>
        </g>

        <g transform="translate(0 414)">
          <rect width="432" height="68" rx="20" fill="#ffffff" stroke="#d5deea" stroke-width="2" />
          <text x="22" y="35" dominant-baseline="middle" fill="#8a93a5" font-size="18">Write a message</text>
          <circle cx="395" cy="34" r="18" fill="url(#button)" />
          <path d="M389 34h12m-6-6 6 6-6 6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>
    </g>
  </g>
</svg>
